<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">

        <section class="card quiz-card">

            <div id="quiz">

                <div class="quiz-top">
                    <span id="questionCounter">
                        Вопрос 1 / 3
                    </span>

                    <span id="questionProgress">
                        33%
                    </span>
                </div>

                <h1 id="questionText"></h1>

                <div id="answers" class="answers"></div>

                <div
                    id="feedback"
                    class="feedback"
                    aria-live="polite">
                </div>

            </div>


            <!-- Загрузка -->

            <div id="loadingScreen" class="hidden">

                <h1>Проверка завершена</h1>

                <p>
                    Система анализирует ответы...
                </p>

                <div class="progress-track">
                    <div
                        id="progressBar"
                        class="progress-bar">
                    </div>
                </div>

                <div id="loadingPercent">
                    0%
                </div>

            </div>


            <!-- Успешная проверка -->

            <div id="successScreen" class="hidden">

                <div class="success-mark">
                    ✓
                </div>

                <h1>
                    Личность подтверждена
                </h1>

                <p>
                    Всё сходится.
                    Проверка успешно окончена.
                </p>

                <button id="okButton" class="btn">
                    Ок
                </button>

            </div>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
